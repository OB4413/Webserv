<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload</title>
  <style>
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;
      font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(135deg,#0f1220,#121633);color:#e6e7ee
    }
    .card{
      width:100%;max-width:420px;background:#171a2e;padding:28px;
      border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.4)
    }
    h1{margin:0 0 10px;font-size:22px}
    p{margin:0 0 16px;color:#9aa0b4;font-size:14px}
    input[type=file]{
      width:100%;padding:12px;border-radius:10px;border:1px dashed #6c7cff;
      background:#0f1220;color:#e6e7ee
    }
    button{
      margin-top:14px;width:100%;padding:12px;border-radius:12px;border:0;
      background:#6c7cff;color:#0b1020;font-weight:700;cursor:pointer
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Upload file</h1>
    <p>Select a file and submit</p>

    <form method="POST" enctype="multipart/form-data">
      <input type="file" name="file" required />
      <button type="submit">Upload</button>
    </form>
  </div>
</body>
</html>
