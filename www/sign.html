<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <style>
    :root {
      --bg: #0f1220;
      --card: #171a2e;
      --text: #e6e7ee;
      --muted: #9aa0b4;
      --accent: #6c7cff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: linear-gradient(135deg, #0f1220, #121633);
      color: var(--text);
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,.4);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 26px;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a {
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      transition: opacity .15s ease, transform .15s ease;
    }

    .primary {
      background: var(--accent);
      color: #0b1020;
    }

    .ghost {
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--text);
    }

    a:hover {
      opacity: .9;
      transform: translateY(-1px);
    }

    footer {
      margin-top: 22px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome 👋</h1>
    <p>You are successfully signed in</p>

    <div class="actions">
      <a href="#" class="primary">Dashboard</a>
      <a href="index.html" class="ghost">Logout</a>
    </div>

    <footer>
      Simple home page
    </footer>
  </div>
</body>
</html>
