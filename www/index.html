<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome</title>
  <style>
    :root {
      --bg: #0f1220;
      --card: #171a2e;
      --text: #e6e7ee;
      --muted: #9aa0b4;
      --accent: #6c7cff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: linear-gradient(135deg, #0f1220, #121633);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      width: 100%;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 40px;
      align-items: center;
    }

    .hero h1 {
      font-size: clamp(32px, 5vw, 48px);
      margin: 0 0 16px;
      line-height: 1.1;
    }

    .hero p {
      color: var(--muted);
      max-width: 45ch;
      margin-bottom: 28px;
      font-size: 15px;
    }

    .buttons {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    a.btn {
      text-decoration: none;
      padding: 14px 22px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      transition: transform .15s ease, opacity .15s ease;
    }

    .primary {
      background: var(--accent);
      color: #0b1020;
    }

    .secondary {
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--text);
    }

    a.btn:hover {
      transform: translateY(-1px);
      opacity: .9;
    }

    .card {
      background: var(--card);
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,.4);
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 760px) {
      .container {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .buttons {
        justify-content: center;
      }
      .hero p { margin-left: auto; margin-right: auto; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <h1>Welcome to My Webserv</h1>
      <p>
        A simple, clean landing page. This is the first page users see when they visit your webserv.
      </p>
      <div class="buttons">
        <a href="index.html" class="btn primary">Sign in</a>
        <a href="#" class="btn secondary">Learn more</a>
      </div>
    </div>

    <div class="card">
      <h3>Why this webserv?</h3>
      <p>
        HTTP server in C++ 98.
      </p>
    </div>
  </div>
</body>
</html>
