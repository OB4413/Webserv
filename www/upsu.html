<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Successful</title>
  <style>
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;
      font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(135deg,#0f1220,#121633);
      color:#e6e7ee;padding:20px
    }
    .card{
      max-width:520px;width:100%;background:#171a2e;padding:32px;
      border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.45);
      text-align:center
    }
    .icon{
      width:80px;height:80px;border-radius:50%;
      background:#22c55e;display:grid;place-items:center;
      margin:0 auto 20px;color:#0b1020;font-size:42px;font-weight:800
    }
    h1{margin:0 0 10px;font-size:24px}
    p{margin:0 0 24px;color:#9aa0b4;font-size:14px;line-height:1.6}
    a{
      display:inline-block;text-decoration:none;padding:12px 20px;
      border-radius:12px;font-weight:700;font-size:14px;
      background:#6c7cff;color:#0b1020;margin:0 6px
    }
    .secondary{background:#2a2f55;color:#e6e7ee}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Upload Successful</h1>
    <p>
      Your file has been uploaded successfully.
      You can upload another file or go back to the home page.
    </p>
    <a href="/upload.html">Upload Another</a>
    <a href="/" class="secondary">Go Home</a>
  </div>
</body>
</html>
