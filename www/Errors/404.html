<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found</title>
  <style>
    :root {
      --bg: #0f1220;
      --card: #171a2e;
      --text: #e6e7ee;
      --muted: #a9abc1;
      --accent: #6c7cff;
      --accent-2: #22d3ee;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      background: radial-gradient(1200px 600px at 20% -10%, #1c2150 0%, transparent 60%),
                  radial-gradient(1000px 500px at 120% 10%, #102a44 0%, transparent 60%),
                  var(--bg);
      color: var(--text);
    }

    .card {
      width: min(92vw, 780px);
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01)), var(--card);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: clamp(20px, 5vw, 48px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      position: relative;
      overflow: hidden;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(108,124,255,0.15);
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 16px;
    }

    .title {
      font-size: clamp(48px, 10vw, 120px);
      line-height: 0.95;
      margin: 0 0 12px;
      letter-spacing: -0.03em;
    }

    .subtitle {
      font-size: clamp(18px, 3.5vw, 26px);
      margin: 0 0 12px;
    }

    .desc {
      color: var(--muted);
      max-width: 60ch;
      margin-bottom: 28px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0b1020;
      box-shadow: 0 10px 30px rgba(108,124,255,0.35);
    }

    .btn-ghost {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 40px rgba(0,0,0,0.35);
    }

    .orbs {
      position: absolute;
      inset: -40% -20% auto auto;
      width: 420px;
      height: 420px;
      filter: blur(60px);
      opacity: 0.6;
      background: radial-gradient(circle at 30% 30%, var(--accent), transparent 60%),
                  radial-gradient(circle at 70% 70%, var(--accent-2), transparent 60%);
      pointer-events: none;
    }

    footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 520px) {
      .actions { justify-content: center; }
      .desc { text-align: center; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="orbs"></div>
    <span class="badge">Error 404</span>
    <h1 class="title">Page not found</h1>
    <h2 class="subtitle">Oops! This page doesn’t exist.</h2>
    <p class="desc">
      The link might be broken, the page may have been removed, or you typed the address incorrectly.
    </p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Go back home</a>
      <a class="btn btn-ghost" href="javascript:history.back()">Go back</a>
    </div>
    <footer>
      If you believe this is an error, please contact support.
    </footer>
  </main>
</body>
</html>
