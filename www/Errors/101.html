<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delete Failed</title>
  <style>
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;
      font-family:system-ui,Arial,sans-serif;
      background:linear-gradient(135deg,#0f1220,#1f2937);
      color:#e5e7eb;padding:20px
    }
    .card{
      max-width:520px;width:100%;background:#111827;
      padding:32px;border-radius:18px;
      box-shadow:0 20px 50px rgba(0,0,0,.45);
      text-align:center
    }
    .icon{
      width:80px;height:80px;border-radius:50%;
      background:#ef4444;display:grid;place-items:center;
      margin:0 auto 20px;font-size:40px;font-weight:800;color:#111827
    }
    h1{margin:0 0 10px;font-size:24px}
    p{margin:0 0 24px;color:#9ca3af;font-size:14px;line-height:1.6}
    a{
      display:inline-block;text-decoration:none;padding:12px 20px;
      border-radius:12px;font-weight:700;font-size:14px;
      background:#6c7cff;color:#0b1020;margin:0 6px
    }
    .secondary{background:#374151;color:#e5e7eb}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✕</div>
    <h1>Delete Failed</h1>
    <p>
      The server was unable to delete the requested file.
      The file may not exist or you may not have permission to remove it.
    </p>
    <a href="/delete.html">Try Again</a>
    <a href="/" class="secondary">Go Home</a>
  </div>
</body>
</html>
