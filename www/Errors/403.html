<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>403 — Forbidden</title>
  <style>
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;
      font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(135deg,#0f1220,#121633);
      color:#e6e7ee;padding:20px
    }
    .card{
      max-width:520px;width:100%;background:#171a2e;padding:32px;
      border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.45);
      text-align:center
    }
    .code{font-size:72px;font-weight:800;color:#ff6b6b;margin:0}
    h1{margin:10px 0;font-size:22px}
    p{margin:0 0 24px;color:#9aa0b4;font-size:14px;line-height:1.6}
    a{
      display:inline-block;text-decoration:none;padding:12px 20px;
      border-radius:12px;font-weight:700;font-size:14px;
      background:#6c7cff;color:#0b1020
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">403</div>
    <h1>Forbidden</h1>
    <p>
      You don’t have permission to access this resource.
      The server understood the request but refuses to authorize it.
    </p>
    <a href="/">Go Home</a>
  </div>
</body>
</html>
