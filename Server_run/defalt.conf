server {
    listen 8080;
	server_name localhost;
    host 127.0.0.1;
    root www/;
    client_max_body_size 3000000;
	index index.html;
    error_page 404 Errors/404.html;
    error_page 403 Errors/403.html;
    error_page 405 Errors/405.html;

    location upload {
        root www;
        allow_methods  DELETE POST GET;
        index index.html;
        autoindex on;
        # return vid.mp4;
    }
    cgi_conf .sh /bin/sh;
    cgi_conf .php /bin/php;
}